<!doctype html>
<html lang="ko" data-theme="">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>light dark</title>
    <style>
      * {
        padding: 0;
        margin: 0;
      }
      body {
        height: 100vh;
      }
      :root {
        color-scheme: light-dark;
        --primary-color: light-dark(#121212, #ebebeb);
        --primary-background: light-dark(#fff, #121212);
        --button-background: light-dark(#f5f5f5, #3a3a3a);
        --toggleBtn-background: light-dark(#04f3ff, yellow);
      }
      [data-theme="light"] {
        color-scheme: light;
      }
      [data-theme="dark"] {
        color-scheme: dark;
      }
      main {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--primary-color);
        background: var(--primary-background);
      }
      button {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        padding: 0 10px;
        height: 24px;
        border-radius: 8px;
        background: var(--button-background);
        border: 0;
        cursor: pointer;
      }
      .btn-toggle {
        border-radius: 50px;
        padding-left: 28px;
      }
      .btn-toggle::before {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: var(--toggleBtn-background);
        transition: 0.1s;
      }
      .btn-toggle:active::before {
        transform: scale(0.9);
      }
      [data-theme="dark"] .btn-toggle::before {
        background: yellow;
      }
    </style>
  </head>
  <body>
    <main>
      <button
        id="theme-btn"
        class="btn-toggle"
        aria-pressed="false"
        aria-label="다크 모드 전환"
      >
        <span id="btnText">light</span>
        ( pressed : <span id="btnPressed"></span>)
      </button>
      <p>
        --primary-color: light dark(#000, #fff);<br />
        --primary-background: light dark(#121212, #fff);<br /><br />

        color: var(--primary-color);<br />
        background: var(--primary-background);
      </p>
    </main>
    <script>
      const htmlTag = document.querySelector("html");
      const btn = document.querySelector("#theme-btn");
      const btnText = document.querySelector("#btnText");
      const btnPressed = document.querySelector("#btnPressed");
      const mediaQuery = window.matchMedia("(prefers-color-scheme:dark)");

      // # 시스템의 라이트/다크 테마 감지 후 테마 데이터 값 변경
      function updateUI(isDark) {
        const theme = isDark ? "dark" : "light";

        htmlTag.dataset.theme = theme;

        btn.setAttribute("aria-pressed", isDark ? "true" : "false");
        btnText.textContent = theme;
        btnPressed.textContent = isDark ? "true" : "false";
      }

      // # 초기 테마 결정 - 다크모드인지 아닌지 판별 --> true / false
      function getInitialTheme() {
        const savedTheme = localStorage.getItem("theme");
        // 사용자가 선택한 테마가 있으면 적용
        if (savedTheme) {
          return savedTheme === "dark"; // savedTheme 가 dark 이면 true 반환
        }
        // 선택한 테마가 없으면 OS 설정 따름
        return mediaQuery.matches; // 다크모드이면 true, 아니면 fasle
      }

      // # 페이지 접속 시 초기화
      let isDark = getInitialTheme(); // true 또는 false
      updateUI(isDark);

      // # 사용자가 테마 변경 시
      mediaQuery.addEventListener("change", function (e) {
        // 이벤트 객체 e.matches에 변경된 결과(true/false)가 바로 들어있습니다.
        // e.matches --> true / false
        if (!localStorage.getItem("theme")) {
          isDark = e.matches;
          updateUI(isDark);
        }
      });

      // # 버튼 클릭 - 테마 변경보다 우선
      btn.addEventListener("click", function () {
        isDark = !isDark;

        // 로컬스토리지 저장
        const newTheme = isDark ? "dark" : "light";
        localStorage.setItem("theme", newTheme);

        updateUI(isDark);
      });
    </script>
  </body>
</html>
