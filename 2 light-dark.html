<!doctype html>
<html lang="ko" data-theme="">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>light dark</title>
    <style>
      * {
        padding: 0;
        margin: 0;
      }
      body {
        height: 100vh;
      }
      :root {
        color-scheme: light-dark;
        --primary-color: light-dark(#121212, #ebebeb);
        --primary-background: light-dark(#fff, #121212);
        --button-background: light-dark(#f5f5f5, #bbb);
      }
      [data-theme="light"] {
        color-scheme: light;
      }
      [data-theme="dark"] {
        color-scheme: dark;
      }
      main {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--primary-color);
        background: var(--primary-background);
      }
      button {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        padding: 0 10px;
        height: 24px;
        border-radius: 8px;
        background: var(--button-background);
        border: 0;
        cursor: pointer;
      }
      .btn-toggle {
        border-radius: 50px;
        padding-left: 28px;
      }
      .btn-toggle::before {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #04f3ff;
        transition: 0.1s;
      }
      .btn-toggle:active::before {
        transform: scale(0.9);
      }
      [data-theme="dark"] .btn-toggle::before {
      }
      [data-theme="dark"] .btn-toggle span {
      }
    </style>
  </head>
  <body>
    <main>
      <button
        id="theme-btn"
        class="btn-toggle"
        aria-pressed="false"
        aria-label="다크 모드 전환"
      >
        <span>light</span>
        ( pressed : <span id="btnPressed"></span>)
      </button>
      <p>
        --primary-color: light dark(#000, #fff);<br />
        --primary-background: light dark(#121212, #fff);<br /><br />

        color: var(--primary-color);<br />
        background: var(--primary-background);
      </p>
    </main>
    <script>
      let thisTheme = "";
      let isDark = window.matchMedia("(prefers-color-scheme:dark)").matches; // true : false
      let mediaQuery = window.matchMedia("(prefers-color-scheme:dark)");
      const htmlTag = document.querySelector("html");
      const btn = document.querySelector("#theme-btn");
      const btnPressed = document.querySelector("#btnPressed");

      // # 시스템의 라이트/다크 테마 감지 후 테마 데이터 값 변경
      function setThemeMode(isDark) {
        thisTheme = isDark ? "dark" : "light";
        htmlTag.dataset.theme = thisTheme;
        btn.setAttribute("aria-pressed", isDark ? "true" : "false");
        btnPressed.textContent = btn.ariaPressed;
      }

      // # 페이지 접속 시 테마 확인
      setThemeMode(isDark);

      // # 사용자가 테마 변경 시
      mediaQuery.addEventListener("change", function (e) {
        // 이벤트 객체 e.matches에 변경된 결과(true/false)가 바로 들어있습니다.
        // e.matches --> true / false
        if (!localStorage.getItem("selectedTheme")) {
          setThemeMode(e.matches);
        }
      });

      // # 버튼 클릭 - 테마 변경보다 우선
      btn.addEventListener("click", function () {
        isDark = !isDark;
        setThemeMode(isDark);

        // 로컬스토리지 저장
        localStorage.setItem("selectedTheme", thisTheme);
      });
    </script>
  </body>
</html>
